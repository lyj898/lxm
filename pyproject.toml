[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2bank"
version = "0.1.0"
description = "H2 Mathematics (9758) prelim paper question bank pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pikepdf>=9.0",
    "anthropic>=0.40",
    "tenacity>=9.0",
]

[tool.setuptools]
package-dir = { "" = "pipeline" }

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
