name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'CNAME'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

  # A push made by the pipeline's GITHUB_TOKEN does NOT trigger `on: push` -
  # GitHub blocks that to prevent workflows re-triggering themselves. Without
  # this, the scheduled run commits a refreshed bank that is never published.
  workflow_run:
    workflows: ["Pipeline (crawl, split, tag)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Do not publish the output of a pipeline run that failed.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run reports the SHA that started the pipeline, which is the
          # commit *before* the bot's data commit. The site only ever deploys
          # from main, so take main's tip.
          ref: main

      - name: Assemble the artifact
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp -R site/. _site/
          cp data/bank.sqlite _site/data/bank.sqlite
          if [ -d data/pdfs ]; then cp -R data/pdfs _site/data/pdfs; fi
          # Custom domain, and belt-and-braces noindex at the served root.
          cp CNAME _site/CNAME
          test -f _site/robots.txt
          ls -la _site _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
