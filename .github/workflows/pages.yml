name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'CNAME'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the artifact
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp -R site/. _site/
          cp data/bank.sqlite _site/data/bank.sqlite
          if [ -d data/pdfs ]; then cp -R data/pdfs _site/data/pdfs; fi
          # Custom domain, and belt-and-braces noindex at the served root.
          cp CNAME _site/CNAME
          test -f _site/robots.txt
          ls -la _site _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
