name: Pipeline (crawl, split, tag)

on:
  schedule:
    # Weekly, Monday 03:17 UTC. With download_cap = 0 in config.toml this run is
    # a deliberate no-op: it re-discovers candidates, changes nothing, and exits.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      cap:
        description: 'School-exams to download (blank = use config.toml download_cap)'
        required: false
        default: ''
      schools:
        description: 'Optional comma-separated school codes, e.g. NJC,RVHS,TJC'
        required: false
        default: ''

permissions:
  contents: write

# One pipeline run at a time: concurrent runs would race on the committed DB.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Tests
        run: python -m pytest -q

      - name: Crawl
        # Inputs go through env, never interpolated into the script body, so a
        # dispatch value cannot inject shell.
        env:
          CAP: ${{ inputs.cap }}
          SCHOOLS: ${{ inputs.schools }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${CAP:-}" ]; then ARGS+=(--cap "$CAP"); fi
          if [ -n "${SCHOOLS:-}" ]; then ARGS+=(--schools "$SCHOOLS"); fi
          python -m h2bank.crawl "${ARGS[@]}"

      - name: Split
        run: python -m h2bank.split

      - name: Tag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set - running rules only"
            python -m h2bank.tag --no-llm
          else
            python -m h2bank.tag
          fi

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  'h2bank-bot'
          git config user.email 'h2bank-bot@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            # No [skip ci]: this workflow has no push trigger, so there is no
            # loop to break, and the tag would also skip the Pages deploy -
            # leaving the refreshed bank committed but never published.
            git commit -m "pipeline: refresh question bank"
            git push
          fi
